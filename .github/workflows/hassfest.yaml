name: Validate with hassfest

on:
  push:
    # A negative pattern, not branches-ignore: GitHub rejects a workflow
    # that combines the two filters on one event.
    branches: ["**", "!dependabot/**"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hassfest has no releases; the pin names the master commit it was
      # reviewed at. Dependabot moves it.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, 2026-09-27
