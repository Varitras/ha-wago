[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path: custom_components is a namespace package
# (no __init__.py), so the root has to be importable for
# `custom_components.wago_879.<module>` to resolve in the tests.
pythonpath = ["."]
norecursedirs = [".git"]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The e2e tests boot a real Home Assistant instance per test, so they are
# deselected for the everyday run. CI and check.sh pass `-m ""`, which cancels
# this deselection - without that the marker would be a silent coverage gap.
addopts = "-m 'not e2e'"
markers = [
  "e2e: full end-to-end test against a real Home Assistant setup (slow)",
]
# Kills a hung test instead of letting it block the suite forever. `thread`
# because the waits this exists for sit in worker threads, where the default
# signal method never fires.
timeout = 300
timeout_method = "thread"

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about missing debug-only code:
  "def __repr__",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  # TYPE_CHECKING and @overload blocks are never executed during pytest run
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
required-version = ">=0.11.0"
# The Python the supported Home Assistant runs on; the mypy section below
# targets the same version and the two have to agree.
target-version = "py314"

[tool.ruff.lint]
select = [
  "A001",   # Variable {name} is shadowing a Python builtin
  "ASYNC",  # flake8-async
  "B002",   # Python does not support the unary prefix increment
  "B005",   # Using .strip() with multi-character strings is misleading
  "B007",   # Loop control variable {name} not used within loop body
  "B009",   # Do not call getattr with a constant attribute value. It is not any safer than normal property access.
  "B014",   # Exception handler with duplicate exception
  "B015",   # Pointless comparison. Did you mean to assign a value? Otherwise, prepend assert or remove it.
  "B017",   # pytest.raises(BaseException) should be considered evil
  "B018",   # Found useless attribute access. Either assign it to a variable or remove it.
  "B023",   # Function definition does not bind loop variable {name}
  "B024",   # `{name}` is an abstract base class, but it has no abstract methods or properties
  "B026",   # Star-arg unpacking after a keyword argument is strongly discouraged
  "B032",   # Possible unintentional type annotation (using :). Did you mean to assign (using =)?
  "B035",   # Dictionary comprehension uses static key
  "B904",   # Use raise from to specify exception cause
  "B905",   # zip() without an explicit strict= parameter
  "BLE",
  "C",      # complexity
  "COM818", # Trailing comma on bare tuple prohibited
  "D",      # docstrings
  "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
  "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
  "E",      # pycodestyle
  "F",      # pyflakes/autoflake
  "F541",   # f-string without any placeholders
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "ICN001", # import concentions; {name} should be imported as {asname}
  "LOG",    # flake8-logging
  "N804",   # First argument of a class method should be named cls
  "N805",   # First argument of a method should be named self
  "N815",   # Variable {name} in class scope should not be mixedCase
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF005", # Consider iterable unpacking instead of concatenation
  "RUF006", # Store a reference to the return value of asyncio.create_task
  "RUF007", # Prefer itertools.pairwise() over zip() when iterating over successive pairs
  "RUF008", # Do not use mutable default values for dataclass attributes
  "RUF010", # Use explicit conversion flag
  "RUF013", # PEP 484 prohibits implicit Optional
  "RUF016", # Slice in indexed access to type {value_type} uses type {index_type} instead of an integer
  "RUF017", # Avoid quadratic list summation
  "RUF018", # Avoid assignment expressions in assert statements
  "RUF019", # Unnecessary key check before dictionary access
  "RUF020", # {never_like} | T is equivalent to T
  "RUF021", # Parenthesize a and b expressions when chaining and and or together, to make the precedence clear
  "RUF022", # Sort __all__
  "RUF023", # Sort __slots__
  "RUF024", # Do not pass mutable objects as values to dict.fromkeys
  "RUF026", # default_factory is a positional-only argument to defaultdict
  "RUF030", # print() call in assert statement is likely unintentional
  "RUF032", # Decimal() called with float literal argument
  "RUF033", # __post_init__ method with argument defaults
  "RUF034", # Useless if-else condition
  "RUF100", # Unused `noqa` directive
  "RUF101", # noqa directives that use redirected rule codes
  "RUF200", # Failed to parse pyproject.toml: {message}
  "S102",   # Use of exec detected
  "S103",   # bad-file-permissions
  "S108",   # hardcoded-temp-file
  "S306",   # suspicious-mktemp-usage
  "S307",   # suspicious-eval-usage
  "S313",   # suspicious-xmlc-element-tree-usage
  "S314",   # suspicious-xml-element-tree-usage
  "S315",   # suspicious-xml-expat-reader-usage
  "S316",   # suspicious-xml-expat-builder-usage
  "S317",   # suspicious-xml-sax-usage
  "S318",   # suspicious-xml-mini-dom-usage
  "S319",   # suspicious-xml-pull-dom-usage
  "S601",   # paramiko-call
  "S602",   # subprocess-popen-with-shell-equals-true
  "S604",   # call-with-shell-equals-true
  "S608",   # hardcoded-sql-expression
  "S609",   # unix-command-wildcard-injection
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T100",   # Trace found: {name} used
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID",    # Tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "UP031",  # Use format specifiers instead of percent format
  "UP032",  # Use f-string instead of `format` call
  "W",      # pycodestyle
]

ignore = [
  # Rules this project deliberately does not enforce. Nothing here is a frozen
  # finding: every code below either fires on code that is written the way this
  # project wants it, or resolves a conflict between two selected rules. Codes
  # outside the `select` block above are not listed - an ignore for a rule that
  # is not on does nothing but suggest a gate that never existed.
  "ASYNC109", # `timeout` parameter instead of asyncio.timeout
  "ASYNC110", # awaiting asyncio.sleep in a while loop instead of an Event
  "D401",     # docstrings not in imperative mood
  "E501",     # line too long; the formatter decides where lines break
  "PERF401",  # loops that could be comprehensions
  "PLW2901",  # loop variable overwritten inside the loop
  "PT018",    # composite assertion broken into parts
  "SIM102",   # nested if statements
  "SIM103",   # return the condition directly
  "SIM108",   # ternary instead of if-else
  "SIM115",   # context handler for opening files
  "SLF001",   # private-member access; the tests reach into the coordinator
  # Moving imports into type-checking blocks can mess with pytest patching
  "TC001",    # move application import into a type-checking block
  "TC002",    # move third-party import into a type-checking block
  "TC003",    # move standard library import into a type-checking block
  "TRY003",   # long messages outside the exception class
  "TRY300",   # returns inside try blocks
  "TRY400",   # logging.exception instead of logging.error
  # Each pairs with a selected rule that says the opposite; ruff warns on every
  # run until one of the two is off, and these are the halves not wanted here.
  "D203",     # 1 blank line required before class docstring (against D211)
  "D213",     # multi-line summary on the second line (against D212)
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
voluptuous = "vol"
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.category_registry" = "cr"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.floor_registry" = "fr"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.helpers.label_registry" = "lr"
"homeassistant.util.color" = "color_util"
"homeassistant.util.dt" = "dt_util"
"homeassistant.util.json" = "json_util"
"homeassistant.util.location" = "location_util"
"homeassistant.util.logging" = "logging_util"
"homeassistant.util.network" = "network_util"
"homeassistant.util.ulid" = "ulid_util"
"homeassistant.util.uuid" = "uuid_util"
"homeassistant.util.yaml" = "yaml_util"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # Allow private member access in tests

# The guards and the harness: assertion messages carry the numbers, a docstring
# per helper would only restate the test name, and the harness reports on
# stdout on purpose (it is a command-line tool, not library code).
"tests/**" = ["PTH", "D", "PLR2004", "T201"]
".github/scripts/*" = ["T201", "D", "INP001", "PLR2004", "S603", "PLW1510"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
property-decorators = ["propcache.api.cached_property"]

[tool.mypy]
python_version = "3.14"
# The type-check scope: every module of the package. A new module has to be
# added here in the same commit that adds it, or it type-checks against
# nothing.
files = [
  "custom_components/wago_879/__init__.py",
  "custom_components/wago_879/config_flow.py",
  "custom_components/wago_879/const.py",
  "custom_components/wago_879/entity_id_rename.py",
  "custom_components/wago_879/logging_policy.py",
  "custom_components/wago_879/migration.py",
  "custom_components/wago_879/sensor.py",
  "custom_components/wago_879/wago_879_api/__init__.py",
  "custom_components/wago_879/wago_879_api/registers.py",
  "custom_components/wago_879/wago_879_api/device.py",
  "custom_components/wago_879/entity_descriptions.py",
  "custom_components/wago_879/coordinator.py",
]

explicit_package_bases = true

# --- OFFICIAL HOME ASSISTANT CI STRICT CORE FLAGS ---
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true

# Silence Home Assistant core noise, keep context intact
[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_errors = true

